[project]
name = "archive-pipeline"
version = "0.1.0"
description = "Non-destructive consolidation of a 30-year photo/video collection into a canonical, date-organized archive with verifiable zero-loss guarantees."
authors = [{ name = "Arno Klein", email = "binarybottle@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "typer (>=0.12)",
    "pillow (>=11.3)",
    "pyexiftool (>=0.5.6,<0.6.0)",
    "imagehash (>=4.3.2,<5.0.0)",
    "pillow-heif (>=1.4.0,<2.0.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[project.scripts]
archive = "archive_pipeline.cli:app"

[tool.poetry]
packages = [{ include = "archive_pipeline", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
hypothesis = ">=6.100"
ruff = ">=0.5"
mypy = ">=1.10"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented dependency-injection idiom uses Depends() in defaults.
"src/archive_pipeline/review/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*", "exiftool.*", "imagehash", "pillow_heif"]
ignore_missing_imports = true
