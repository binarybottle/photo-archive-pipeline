[project]
name = "archive-pipeline"
version = "0.1.0"
description = "Non-destructive consolidation of a 30-year photo/video collection into a canonical, date-organized archive with verifiable zero-loss guarantees."
authors = [{ name = "Arno Klein", email = "binarybottle@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "typer (>=0.12)",
    "pillow (>=11.3)",
]

[project.scripts]
archive = "archive_pipeline.cli:app"

[tool.poetry]
packages = [{ include = "archive_pipeline", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
hypothesis = ">=6.100"
ruff = ">=0.5"
mypy = ">=1.10"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
